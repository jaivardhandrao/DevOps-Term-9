name: Final project CI and disposable CD

on:
  # Explicit manual execution; publishing additionally requires its own confirmation.
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish verified images to GHCR (main only)
        type: boolean
        default: false
      confirmation:
        description: Type PUBLISH TO GHCR to authorize registry publication
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: final-project-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT: final-devops-project
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    name: Backend tests and frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: final-devops-project/application/frontend/package-lock.json
      - name: Install and test backend
        working-directory: final-devops-project/application/backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q --junitxml=../../../evidence/backend-tests.xml
      - name: Build and test frontend
        working-directory: final-devops-project/application/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Upload test and frontend artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-and-frontend-${{ github.sha }}
          path: |
            evidence/backend-tests.xml
            final-devops-project/application/frontend/dist
          retention-days: 7

  source-security:
    name: SAST, SCA and secret gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned security tools
        run: |
          bash "$PROJECT/security/install-ci-tools.sh" security "$RUNNER_TEMP/ci-bin"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
          python -m pip install bandit==1.9.4
          mkdir -p evidence/security
      - name: SAST gate (medium and high findings)
        run: bandit -r "$PROJECT/application/backend/app" --severity-level medium --format json --output evidence/security/sast.json
      - name: Dependency gate (HIGH and CRITICAL)
        run: trivy fs --include-dev-deps --file-patterns 'pip:requirements.*\.txt$' --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output evidence/security/sca.json "$PROJECT/application"
      - name: Secret gate (entire checked-out tree, redacted)
        run: gitleaks dir . --config "$PROJECT/security/gitleaks.toml" --redact=100 --report-format json --report-path evidence/security/secrets.json
      - name: Prove gates reject negative controls
        run: bash "$PROJECT/security/test-gates.sh" | tee evidence/security/negative-controls.txt
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-security-${{ github.sha }}
          path: evidence/security
          retention-days: 7

  images:
    name: Build and scan ${{ matrix.component }}
    needs: [test, source-security]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install scanner
        run: |
          bash "$PROJECT/security/install-ci-tools.sh" security "$RUNNER_TEMP/ci-bin"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
          mkdir -p evidence/images
      - name: Build image for this exact commit
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker build --pull --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "taskboard-$COMPONENT:$GITHUB_SHA" -f "$PROJECT/docker/$COMPONENT.Dockerfile" "$PROJECT"
      - name: Container gate (HIGH and CRITICAL, including unfixed findings)
        env:
          COMPONENT: ${{ matrix.component }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "evidence/images/$COMPONENT-scan.json" "taskboard-$COMPONENT:$GITHUB_SHA"
      - name: Save only the scanned image
        env:
          COMPONENT: ${{ matrix.component }}
        run: docker save "taskboard-$COMPONENT:$GITHUB_SHA" | gzip > "evidence/images/$COMPONENT.tar.gz"
      - name: Upload image and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.component }}-${{ github.sha }}
          path: evidence/images
          retention-days: 2

  disposable-cd:
    name: Helm deployment to disposable kind
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*-${{ github.sha }}
          path: evidence/images
          merge-multiple: true
      - name: Install cluster tools
        run: |
          bash "$PROJECT/security/install-ci-tools.sh" cluster "$RUNNER_TEMP/ci-bin"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - name: Create isolated cluster and deploy exact scanned images
        run: |
          kind create cluster --name taskboard-ci --image kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d --wait 120s
          kubectl apply -f "$PROJECT/security/ci/metrics-server-v0.9.0.yaml"
          # kind's disposable kubelet uses a self-signed certificate. This flag is
          # restricted to this job's new local cluster, never a production target.
          kubectl -n kube-system patch deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
          kubectl wait --for=condition=Available apiservice/v1beta1.metrics.k8s.io --timeout=180s
          for component in backend frontend; do
            gunzip -c "evidence/images/$component.tar.gz" | docker load
            kind load docker-image "taskboard-$component:$GITHUB_SHA" --name taskboard-ci
          done
          kubectl create namespace taskboard-ci
          credential=$(mktemp)
          trap 'rm -f "$credential"' EXIT
          python3 -c 'import secrets; print(secrets.token_hex(32), end="")' > "$credential"
          kubectl -n taskboard-ci create secret generic taskboard-db --from-file="password=$credential"
          helm lint "$PROJECT/helm/taskboard"
          helm upgrade --install taskboard "$PROJECT/helm/taskboard" --namespace taskboard-ci \
            --set backend.image.repository=taskboard-backend --set backend.image.tag="$GITHUB_SHA" --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=taskboard-frontend --set frontend.image.tag="$GITHUB_SHA" --set frontend.image.pullPolicy=Never \
            --wait --wait-for-jobs --timeout 5m
      - name: Verify deployed UI and database-backed API
        run: |
          mkdir -p evidence/deployment
          kubectl -n taskboard-ci port-forward service/frontend 18080:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          python3 "$PROJECT/security/smoke-deployment.py" http://127.0.0.1:18080 | tee evidence/deployment/smoke.txt
          kubectl -n taskboard-ci wait --for=condition=ScalingActive hpa/backend --timeout=180s
          kubectl -n taskboard-ci get hpa -o wide > evidence/deployment/hpa.txt
          kubectl -n taskboard-ci top pods > evidence/deployment/pod-metrics.txt
          kubectl -n taskboard-ci get pods,services,pvc -o wide > evidence/deployment/resources.txt
          helm list --namespace taskboard-ci > evidence/deployment/helm.txt
      - name: Capture failure diagnostics without Secrets
        if: failure()
        run: |
          mkdir -p evidence/deployment
          kubectl -n taskboard-ci get pods,services,pvc -o wide > evidence/deployment/resources.txt 2>&1 || true
          kubectl -n taskboard-ci get events --sort-by=.lastTimestamp > evidence/deployment/events.txt 2>&1 || true
          kubectl -n kube-system get deployment metrics-server -o wide > evidence/deployment/metrics-server.txt 2>&1 || true
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disposable-deployment-${{ github.sha }}
          path: evidence/deployment
          retention-days: 7
      - name: Destroy only this job's cluster
        if: always()
        run: kind delete cluster --name taskboard-ci

  publish:
    name: Explicitly authorized GHCR publication
    needs: disposable-cd
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images && inputs.confirmation == 'PUBLISH TO GHCR' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*-${{ github.sha }}
          path: images
          merge-multiple: true
      - name: Publish verified commit images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/ghcr-auth"
          trap 'docker logout ghcr.io >/dev/null 2>&1; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          owner_lower=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          for component in backend frontend; do
            gunzip -c "images/$component.tar.gz" | docker load
            destination="ghcr.io/$owner_lower/devops-term-9-$component:$GITHUB_SHA"
            docker tag "taskboard-$component:$GITHUB_SHA" "$destination"
            docker push "$destination"
          done
