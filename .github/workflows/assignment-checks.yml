name: Assignment tests and static checks

on:
  pull_request:
  push:
    branches: [main, 'homework/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: final-devops-project/application/frontend/package-lock.json
      - name: Install test dependencies
        run: python -m pip install -r final-devops-project/application/backend/requirements-dev.txt PyYAML==6.0.3
      - name: Test capture recovery using fake CLIs
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate Kubernetes references and isolated demo handler
        # Parses YAML and starts only a temporary localhost HTTP handler.
        # Never invokes kubectl or accesses a Kubernetes API.
        run: python scripts/validate-kubernetes.py
      - name: Backend unit tests (SQLite)
        working-directory: final-devops-project/application/backend
        run: python -m pytest -q --junitxml=../../../evidence/backend-tests.xml
      - name: Frontend tests and production build
        working-directory: final-devops-project/application/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install versioned Helm for offline chart rendering
        run: |
          mkdir -p "$RUNNER_TEMP/helm-download" "$RUNNER_TEMP/ci-bin"
          cd "$RUNNER_TEMP/helm-download"
          curl --fail --location --silent --show-error --retry 3 https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o helm-v4.3.0-linux-amd64.tar.gz
          curl --fail --location --silent --show-error --retry 3 https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum -o checksums.txt
          sha256sum --check checksums.txt
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz linux-amd64/helm
          install -m 0755 linux-amd64/helm "$RUNNER_TEMP/ci-bin/helm"
          echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
      - name: Helm lint, render and probe regression check (no cluster)
        run: |
          helm lint helm/notes-chart
          helm lint final-devops-project/helm/taskboard
          helm template notes helm/notes-chart > "$RUNNER_TEMP/notes.yaml"
          helm template taskboard final-devops-project/helm/taskboard --namespace taskboard-ci --set ingress.enabled=true > "$RUNNER_TEMP/taskboard.yaml"
          python scripts/check-chart-probes.py
      - name: Upload test report and frontend build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: assignment-checks-${{ github.sha }}
          path: |
            evidence/backend-tests.xml
            final-devops-project/application/frontend/dist
          retention-days: 7
