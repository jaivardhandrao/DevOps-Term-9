<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-stage Docker Build</title>
    <style>
      :root { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #d7e2ea; background: #101820; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(42rem, calc(100vw - 4rem)); border: 1px solid #375265; padding: 3rem; background: #172630; }
      small { color: #7dd3a8; }
      h1 { margin: 0.8rem 0; font-size: clamp(2rem, 7vw, 4rem); line-height: 1.05; }
    </style>
  </head>
  <body>
    <main>
      <small>builder: Node.js / runtime: Nginx</small>
      <h1>Hello World from Docker multi-stage build</h1>
      <p>The build tools stay in stage one; only the static output reaches this image.</p>
    </main>
  </body>
</html>
