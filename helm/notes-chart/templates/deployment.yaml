apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-notes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: notes}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/name: notes}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: notes
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - {name: http, containerPort: 80}
          envFrom:
            - configMapRef: {name: {{ .Release.Name }}-config}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 20
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html/index.html, subPath: index.html, readOnly: true}
      volumes:
        - name: page
          configMap: {name: {{ .Release.Name }}-config}
