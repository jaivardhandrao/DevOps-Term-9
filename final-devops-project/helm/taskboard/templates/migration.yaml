apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: [alembic, upgrade, head]
          env:
            {{- include "taskboard.databaseEnv" . | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          volumeMounts:
            - {name: db-password, mountPath: /run/secrets/db, readOnly: true}
      volumes:
        - name: db-password
          secret:
            secretName: {{ .Values.database.existingSecret }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.database.secretKey }}, path: password}
