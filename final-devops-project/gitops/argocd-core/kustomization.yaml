apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring-oct7
resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/core-install.yaml
patches:
  # Upstream pins this subject to argocd; Kustomize does not rewrite it here.
  - target:
      kind: ClusterRoleBinding
      name: argocd-application-controller
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: monitoring-oct7
  - target:
      kind: Deployment
      name: argocd-applicationset-controller
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: argocd-repo-server
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-repo-server
      spec:
        template:
          spec:
            containers:
              - name: argocd-repo-server
                resources:
                  requests: {cpu: 25m, memory: 96Mi}
                  limits: {cpu: 300m, memory: 256Mi}
  - target:
      kind: Deployment
      name: argocd-redis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: argocd-redis
      spec:
        template:
          spec:
            containers:
              - name: redis
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {cpu: 100m, memory: 96Mi}
  - target:
      kind: StatefulSet
      name: argocd-application-controller
    patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: argocd-application-controller
      spec:
        template:
          spec:
            containers:
              - name: argocd-application-controller
                resources:
                  requests: {cpu: 25m, memory: 128Mi}
                  limits: {cpu: 300m, memory: 384Mi}
  - target:
      kind: ConfigMap
      name: argocd-cmd-params-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cmd-params-cm
      data:
        controller.status.processors: "2"
        controller.operation.processors: "1"
        reposerver.parallelism.limit: "1"
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        timeout.reconciliation: 60s
        timeout.reconciliation.jitter: 10s
