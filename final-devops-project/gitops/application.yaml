apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskboard
  namespace: monitoring-oct7
spec:
  project: taskboard
  source:
    repoURL: https://github.com/jaivardhandrao/DevOps-Term-9.git
    targetRevision: homework/october-7-completion
    path: final-devops-project/helm/taskboard
    helm:
      releaseName: taskboard
      valuesObject:
        backend:
          image: {repository: taskboard-backend, tag: local, pullPolicy: Never}
        frontend:
          image: {repository: taskboard-frontend, tag: local, pullPolicy: Never}
  destination:
    server: https://kubernetes.default.svc
    namespace: capstone-oct7
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      backoff: {duration: 5s, factor: 2, maxDuration: 30s}
