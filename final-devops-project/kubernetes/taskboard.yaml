apiVersion: batch/v1
kind: Job
metadata:
  name: taskboard-migrate-1
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/instance: taskboard
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: taskboard
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: "taskboard-backend:local"
          imagePullPolicy: IfNotPresent
          command: [alembic, upgrade, head]
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "taskboard"
            - name: DB_USER
              value: "taskboard"
            - name: DB_PASSWORD_FILE
              value: /run/secrets/db/password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          volumeMounts:
            - {name: db-password, mountPath: /run/secrets/db, readOnly: true}
      volumes:
        - name: db-password
          secret:
            secretName: taskboard-db
            defaultMode: 0440
            items:
              - {key: password, path: password}
