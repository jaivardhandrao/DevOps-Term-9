global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: taskboard
    static_configs:
      - targets: ["backend.capstone-oct7.svc.cluster.local:8000"]
  - job_name: taskboard-readiness
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ["http://backend.capstone-oct7.svc.cluster.local:8000/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
