# Run from final-devops-project with the application's compose.yaml.
services:
  prometheus:
    image: prom/prometheus:v3.6.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=2h]
    volumes:
      - ./monitoring/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:19090:9090"]
    networks: [internal, web]
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    command: [--config.file=/etc/blackbox_exporter/config.yml]
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [internal]
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
    secrets: [grafana_admin]
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/taskboard.yml:ro
      - ./monitoring/taskboard-dashboard.json:/var/lib/grafana/dashboards/taskboard.json:ro
    ports: ["127.0.0.1:13000:3000"]
    networks: [internal, web]
secrets:
  grafana_admin:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?set a local generated password-file path}
