apiVersion: apps/v1
kind: Deployment
metadata:
  name: trouble-web
  namespace: devops-advanced
spec:
  replicas: 2
  selector:
    matchLabels: {app: trouble-web}
  template:
    metadata:
      labels: {app: trouble-web}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - {name: http, containerPort: 80}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 48Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: trouble-web
  namespace: devops-advanced
spec:
  selector: {app: trouble-web}
  ports:
    - {port: 80, targetPort: http}
