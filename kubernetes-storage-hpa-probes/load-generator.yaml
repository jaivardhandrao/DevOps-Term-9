apiVersion: batch/v1
kind: Job
metadata:
  name: advanced-load
  namespace: devops-advanced
spec:
  activeDeadlineSeconds: 240
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: load
          image: busybox:1.36.1
          command: [sh, -c]
          args:
            - 'for i in 1 2 3 4; do (while true; do wget -q -T 4 -O /dev/null http://advanced-web/work; done) & done; wait'
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
