apiVersion: v1
kind: ConfigMap
metadata:
  name: advanced-code
  namespace: devops-advanced
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    import hashlib
    from pathlib import Path

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/work":
                hashlib.pbkdf2_hmac("sha256", b"lab-input", b"lab-salt", 150000)
            if self.path == "/ready" and Path("/tmp/not-ready").exists():
                self.send_error(503, "readiness deliberately disabled")
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(b"Session 13: persistent, probed, autoscaled web app\n")
        def log_message(self, fmt, *args):
            if self.path not in ("/health", "/ready"):
                super().log_message(fmt, *args)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
