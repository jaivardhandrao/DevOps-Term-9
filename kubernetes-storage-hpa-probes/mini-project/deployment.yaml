apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-web
  namespace: devops-advanced
spec:
  replicas: 2
  selector:
    matchLabels: {app: advanced-web}
  template:
    metadata:
      labels: {app: advanced-web}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: web
          image: python:3.12-alpine
          command: [python, /app/server.py]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          volumeMounts:
            - {name: code, mountPath: /app, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: temporary, mountPath: /tmp}
      volumes:
        - name: code
          configMap: {name: advanced-code}
        - name: data
          persistentVolumeClaim: {claimName: advanced-data}
        - name: temporary
          emptyDir: {sizeLimit: 16Mi}
